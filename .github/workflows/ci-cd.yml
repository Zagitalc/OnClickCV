name: CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
      - v4
  pull_request:
    branches:
      - main
      - master
      - v4
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22.12.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run client tests
        run: npm test
        working-directory: client

      - name: Run server tests
        run: npm test
        working-directory: server

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Audit client production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

      - name: Audit server production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t onclickcv:${{ github.sha }} .

      - name: Print runtime versions
        run: docker run --rm --entrypoint node onclickcv:${{ github.sha }} server/utils/runtimeDiagnostics.js

      - name: Start smoke-test container
        run: docker run -d --name onclickcv-smoke -p 10000:10000 onclickcv:${{ github.sha }}

      - name: Wait for health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs onclickcv-smoke
          exit 1

      - name: Smoke test DOCX export
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @server/tests/fixtures/export-smoke.json \
            --output /tmp/onclickcv-smoke.docx \
            http://127.0.0.1:10000/api/export/word
          test -s /tmp/onclickcv-smoke.docx

      - name: Smoke test PDF export
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @server/tests/fixtures/export-smoke.json \
            --output /tmp/onclickcv-smoke.pdf \
            http://127.0.0.1:10000/api/export/pdf
          test -s /tmp/onclickcv-smoke.pdf

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f onclickcv-smoke
